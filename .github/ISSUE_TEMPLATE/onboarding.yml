name: Onboarding
description: First exercise for new developers
title: "[Onboarding]: "
labels: ["onboarding"]

body:
  - type: markdown
    attributes:
      value: |
        Welcome to the team! This is your first exercise to get familiar with the codebase and workflow.

        **Timeline:** 2 weeks of self-study — no hard deadline, just learning.

  - type: input
    id: developer-name
    attributes:
      label: Developer Name
      placeholder: "First Last"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Your Task

        Create your own team page with a button counter. See `docs/first-exercise.md` for detailed instructions.

        ### What to Build

        1. **Team page** — `src/app/team/[yourlastname]/page.tsx`
           - Your name, role, and a fun fact
           - A button with click counter using `useState`

        2. **Test file** — `test/team/[yourlastname].test.tsx`
           - Test that your page renders your name
           - Test that the counter increments on click

        3. **README update** — Add your name to the team list

        ### Resources

        - Example page: `src/app/team/rutledge/page.tsx`
        - Example test: `test/team/rutledge.test.tsx`
        - [React useState Hook](https://react.dev/reference/react/useState)
        - [Vitest Testing](https://vitest.dev/guide/)
        - [React Testing Library](https://testing-library.com/docs/react-testing-library/intro/)

  - type: checkboxes
    id: checklist
    attributes:
      label: Completion Checklist
      options:
        - label: Created team page in `src/app/team/[lastname]/page.tsx`
        - label: Added button with useState counter
        - label: Created test file in `test/team/[lastname].test.tsx`
        - label: Tests pass locally (`npm test`)
        - label: Added name to README team list
        - label: Opened PR and assigned tech lead for review

  - type: markdown
    attributes:
      value: |
        ## What's Next

        After this exercise, you'll work in pairs on real issues. Pairs are formed before Sprint 1 and stay together all quarter. Pairing is encouraged but not required. See [Contributing](docs/contributing.md) for the pair workflow.
